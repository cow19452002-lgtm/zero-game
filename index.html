<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>0.00초 맞추기</title>
<!--
  0.00초 맞추기 — 프로젝터 공동 카운트 버전 (최대 7명)
  - 진행자(프로젝터): 주소 끝에 ?host 를 붙여 열기 → QR, 큰 카운트, 결과
  - 참가자(휴대폰): QR로 접속 → 닉네임 입력 → 프로젝터를 보며 STOP
  ※ Firebase 테스트 모드 DB는 행사 후 삭제하세요.
-->
<script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAfdYEgUyT8zk6ln_-B7IBUVY0yyd_laZE",
    authDomain: "zero-game-a1511.firebaseapp.com",
    databaseURL: "https://zero-game-a1511-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "zero-game-a1511",
    storageBucket: "zero-game-a1511.firebasestorage.app",
    messagingSenderId: "42120447539",
    appId: "1:42120447539:web:cb19dea02a0f2073044546"
  };
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: #0f172a; color: #e2e8f0;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .35; cursor: default; }
  select { font: inherit; padding: 8px; border-radius: 8px; border: 0; }
  .card { background: #1e293b; border-radius: 18px; padding: 18px; }
  .notice { background: #7c2d12; color: #fff; border-radius: 10px; padding: 12px; font-size: 16px; line-height: 1.5; margin: 10px 0; }
  #conn { font-size: 13px; opacity: .7; }

  /* ===== 진행자(프로젝터) ===== */
  #host { display: grid; grid-template-columns: 300px 1fr; gap: 18px; height: 100vh; padding: 18px; }
  #host .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; }
  #qr img, #qr canvas { display: block; width: 230px; height: 230px; }
  .qrCard { text-align: center; }
  .qrCard p { margin: 10px 0 0; font-size: 18px; font-weight: 800; }
  .players h3 { margin: 0 0 8px; font-size: 18px; }
  .players ul { list-style: none; margin: 0; padding: 0; }
  .players li { padding: 8px 10px; border-radius: 8px; background: #0f172a; margin-bottom: 6px; font-size: 18px; font-weight: 700;
    display: flex; justify-content: space-between; gap: 8px; }
  .players li .tag { font-size: 13px; opacity: .7; font-weight: 400; }
  .players li.done .tag { color: #4ade80; opacity: 1; }
  .main { display: flex; flex-direction: column; min-height: 0; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  #bigLabel { font-size: 3vw; font-weight: 700; opacity: .8; min-height: 1.3em; }
  #bigNum { font-size: 22vw; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  #bigNum.secret { color: #475569; }
  #bigNum.danger { color: #f87171; }
  #pressCount { font-size: 2.2vw; margin-top: 10px; opacity: .85; min-height: 1.3em; }
  #results { width: 100%; max-width: 1000px; }
  #results h2 { margin: 0 0 10px; font-size: 2.4vw; }
  #results ol { list-style: none; margin: 0; padding: 0; }
  #results li { display: grid; grid-template-columns: 70px 1fr 200px 200px; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 12px; background: #1e293b; margin-bottom: 8px; font-size: 2vw; font-weight: 800; }
  #results li .stopAt, #results li .diff { text-align: right; font-variant-numeric: tabular-nums; }
  #results li .stopAt { opacity: .7; font-weight: 600; }
  #results li.miss { opacity: .5; }
  #results li:first-child:not(.miss) { background: #854d0e; }
  .hostCtrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px; }
  .hostCtrl button { padding: 14px 22px; font-size: 18px; background: #475569; color: #fff; }
  .hostCtrl button.go { background: #22c55e; color: #052e16; font-size: 22px; padding: 16px 34px; }
  .hostCtrl button.danger { background: #b91c1c; }
  .hostCtrl label { display: inline-flex; gap: 6px; align-items: center; font-size: 15px; }
  @media (max-width: 900px) {
    #host { grid-template-columns: 1fr; height: auto; }
    #bigNum { font-size: 30vw; } #bigLabel { font-size: 6vw; }
    #results li { font-size: 4vw; grid-template-columns: 40px 1fr 90px 110px; }
  }

  /* ===== 참가자(휴대폰) ===== */
  #player { min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 14px; }
  #player h1 { margin: 0; font-size: 22px; }
  #joinBox input { font: inherit; font-size: 20px; padding: 14px; border-radius: 12px; border: 0; width: 100%; margin: 12px 0; user-select: text; -webkit-user-select: text; }
  #joinBtn { width: 100%; padding: 18px; font-size: 22px; background: #22c55e; color: #052e16; }
  #playBox { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  #pNick { font-size: 16px; opacity: .8; }
  #pStatus { font-size: 22px; font-weight: 800; text-align: center; min-height: 2.6em; line-height: 1.3; }
  #stopBtn {
    flex: 1; min-height: 50vh; width: 100%; font-size: 64px; border-radius: 28px;
    background: #334155; color: #94a3b8; transition: transform .05s;
  }
  #stopBtn.live { background: #ef4444; color: #fff; box-shadow: 0 0 0 6px rgba(239,68,68,.25); }
  #stopBtn.live:active { transform: scale(.98); }
  #stopBtn.pressed { background: #1d4ed8; color: #fff; }
  #myResult { text-align: center; font-size: 20px; line-height: 1.5; min-height: 3em; }
  #myResult b { font-size: 34px; }
  .leave { background: none; color: #7dd3fc; font-weight: 400; text-decoration: underline; font-size: 14px; padding: 6px; align-self: center; }
</style>
</head>
<body>

<!-- ===================== 진행자(프로젝터) ===================== -->
<div id="host" hidden>
  <div class="side">
    <div class="card qrCard">
      <div id="qr"></div>
      <p>QR을 찍고 참가하세요</p>
      <div id="conn"></div>
    </div>
    <div class="card players">
      <h3>참가자 <span id="pCount">0</span>/7</h3>
      <ul id="pList"></ul>
    </div>
  </div>
  <div class="main">
    <div class="stage">
      <div id="bigLabel">참가자를 기다리는 중</div>
      <div id="bigNum">10.00</div>
      <div id="pressCount"></div>
      <div id="results" hidden>
        <h2 id="resTitle">결과</h2>
        <ol id="resList"></ol>
      </div>
    </div>
    <div class="card hostCtrl">
      <button id="startBtn" class="go">▶ 카운트 시작</button>
      <label>숫자 표시
        <select id="modeSel">
          <option value="hide3">남은 3초부터 숨김</option>
          <option value="blind">처음부터 숨김</option>
          <option value="visible">끝까지 보임</option>
        </select>
      </label>
      <button id="lobbyBtn">대기 화면으로</button>
      <button id="resetBtn" class="danger">참가자 초기화</button>
    </div>
  </div>
</div>

<!-- ===================== 참가자(휴대폰) ===================== -->
<div id="player" hidden>
  <h1>0.00초 맞추기</h1>
  <div id="pConn" style="font-size:13px;opacity:.7"></div>
  <div id="errBox" class="notice" hidden></div>

  <div id="joinBox" class="card">
    <div style="font-size:18px;font-weight:800">닉네임을 입력하세요</div>
    <input type="text" id="nickInput" maxlength="10" placeholder="예: 홍길동">
    <button id="joinBtn" disabled>참가하기</button>
    <div id="joinMsg" class="notice" hidden></div>
  </div>

  <div id="playBox" hidden>
    <div id="pNick"></div>
    <div id="pStatus">대기 중</div>
    <button id="stopBtn" disabled>STOP</button>
    <div id="myResult"></div>
    <button id="leaveBtn" class="leave">나가기</button>
  </div>
</div>

<script>
(() => {
  const MAX_PLAYERS = 7;
  const LIMIT = 10000;   // 10.00 → 0.00
  const OVER = 2000;     // 0.00 이후 2초까지 STOP 받음
  const READY = 3000;    // 시작 전 3·2·1
  const $ = (id) => document.getElementById(id);
  const isHost = new URLSearchParams(location.search).has("host");
  const localNow = () => performance.timeOrigin + performance.now();

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function fatal(msg) {
    const box = isHost ? $("conn") : $("errBox");
    $(isHost ? "host" : "player").hidden = false;
    box.hidden = false;
    box.textContent = "⚠ " + msg;
    if (isHost) box.style.cssText = "background:#7c2d12;color:#fff;padding:10px;border-radius:8px;opacity:1;margin-top:8px";
  }
  if (typeof FIREBASE_CONFIG === "undefined" || !FIREBASE_CONFIG) { fatal("Firebase 설정값(FIREBASE_CONFIG)이 없습니다."); return; }
  if (!window.firebase) { fatal("Firebase를 불러오지 못했습니다. 인터넷 연결이나 회사 방화벽을 확인하세요."); return; }

  firebase.initializeApp(FIREBASE_CONFIG);
  const fb = firebase.database();

  let myId = lsGet("zeroPid");
  if (!myId) { myId = "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet("zeroPid", myId); }

  // ---------- 서버 시계 맞추기 ----------
  // 서버 시각과 이 기기 시각의 차이를 여러 번 재서, 왕복 시간이 가장 짧은 값을 씁니다.
  let offset = 0, offsetRtt = Infinity, synced = false;
  fb.ref(".info/serverTimeOffset").on("value", (s) => {
    if (!synced) offset = Number(s.val()) || 0;   // 정밀 측정 전 임시값
  });
  async function syncClock(samples = 6) {
    const ref = fb.ref("zero/clock/" + myId);
    for (let i = 0; i < samples; i++) {
      try {
        const t1 = localNow();
        await ref.set(firebase.database.ServerValue.TIMESTAMP);
        const t2 = localNow();
        const ts = (await ref.get()).val();
        const rtt = t2 - t1;
        if (typeof ts === "number" && rtt < offsetRtt) {
          offsetRtt = rtt;
          offset = ts - (t1 + t2) / 2;
          synced = true;
        }
      } catch (e) {}
    }
    ref.remove().catch(() => {});
  }
  const serverNow = () => localNow() + offset;

  let onChange = () => {};

  // ---------- 공유 상태 ----------
  let state = { round: 0, phase: "lobby", startAt: 0, mode: "hide3" };
  let players = {};   // pid -> {nick, joinedAt}
  let presses = {};   // pid -> {at, diff}  (현재 라운드)
  let pressRef = null;
  const endAt = () => state.startAt + READY + LIMIT;

  function listenPresses() {
    if (pressRef) pressRef.off();
    presses = {};
    pressRef = fb.ref("zero/presses/" + state.round);
    pressRef.on("value", (s) => { presses = s.val() || {}; onChange(); });
  }

  fb.ref("zero/state").on("value", (snap) => {
    const d = snap.val() || {};
    const prevRound = state.round;
    state = {
      round: Number(d.round) || 0,
      phase: ["lobby", "running", "result"].includes(d.phase) ? d.phase : "lobby",
      startAt: Number(d.startAt) || 0,
      mode: ["hide3", "blind", "visible"].includes(d.mode) ? d.mode : "hide3",
    };
    if (!pressRef || prevRound !== state.round) listenPresses();
    if (isHost) $("modeSel").value = state.mode;
    onChange();
  }, () => fatal("데이터베이스에 접근할 수 없습니다. Firebase Realtime Database 규칙(테스트 모드)을 확인하세요."));

  fb.ref("zero/players").on("value", (s) => { players = s.val() || {}; onChange(); });

  function ranking() {
    const list = Object.entries(players).map(([pid, p]) => {
      const pr = presses[pid];
      return { pid, nick: String(p.nick || "참가자").slice(0, 10), diff: pr && typeof pr.diff === "number" ? pr.diff : null };
    });
    list.sort((a, b) => {
      if (a.diff === null && b.diff === null) return 0;
      if (a.diff === null) return 1;
      if (b.diff === null) return -1;
      return Math.abs(a.diff) - Math.abs(b.diff);
    });
    return list;
  }
  function fmtDiff(d) {
    if (d === null) return "미입력";
    if (d === 0) return "0 ms";
    return (d > 0 ? "+" : "−") + Math.abs(d) + " ms";
  }
  function stopAtText(d) {   // 멈춘 순간 화면에 보였어야 할 숫자
    if (d === null) return "";
    return (-d / 1000).toFixed(2);
  }


  // =========================================================
  //                        진행자 화면
  // =========================================================
  if (isHost) {
    $("host").hidden = false;
    const joinUrl = location.origin + location.pathname;
    try { new QRCode($("qr"), { text: joinUrl, width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { $("qr").textContent = "QR 오류"; }

    fb.ref(".info/connected").on("value", (s) => {
      $("conn").textContent = s.val() ? "● 실시간 연결됨" : "연결 중…";
    });
    syncClock(8);

    function renderPlayers() {
      const ul = $("pList");
      ul.textContent = "";
      const ids = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
      $("pCount").textContent = ids.length;
      ids.forEach((pid) => {
        const li = document.createElement("li");
        const n = document.createElement("span");
        n.textContent = String(players[pid].nick || "참가자").slice(0, 10);
        const tag = document.createElement("span");
        tag.className = "tag";
        if (state.phase === "running" && presses[pid]) { li.classList.add("done"); tag.textContent = "✔ STOP"; }
        else tag.textContent = state.phase === "running" ? "…" : "";
        li.append(n, tag);
        ul.appendChild(li);
      });
      if (!ids.length) {
        const li = document.createElement("li");
        li.style.opacity = ".6"; li.textContent = "아직 없음";
        ul.appendChild(li);
      }
    }

    function renderResults() {
      const ol = $("resList");
      ol.textContent = "";
      $("resTitle").textContent = `${state.round}판 결과`;
      let rank = 0;
      ranking().forEach((r) => {
        const li = document.createElement("li");
        if (r.diff === null) li.classList.add("miss"); else rank++;
        const a = document.createElement("span");
        a.textContent = r.diff === null ? "-" : rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank + "위";
        const b = document.createElement("span"); b.textContent = r.nick;
        const c = document.createElement("span"); c.className = "stopAt"; c.textContent = stopAtText(r.diff);
        const d = document.createElement("span"); d.className = "diff"; d.textContent = fmtDiff(r.diff);
        li.append(a, b, c, d);
        ol.appendChild(li);
      });
    }

    onChange = () => {
      renderPlayers();
      const showRes = state.phase === "result";
      $("results").hidden = !showRes;
      $("bigNum").hidden = showRes;
      $("pressCount").hidden = showRes;
      if (showRes) { $("bigLabel").textContent = ""; renderResults(); }
      if (state.phase !== "running") {
        $("bigNum").className = "";
        if (state.phase === "lobby") {
          $("bigLabel").textContent = Object.keys(players).length ? "준비되면 ‘카운트 시작’을 누르세요" : "참가자를 기다리는 중";
          $("bigNum").textContent = "10.00";
          $("pressCount").textContent = "";
        }
      }
      $("startBtn").disabled = state.phase === "running" || !Object.keys(players).length;
      $("startBtn").textContent = state.round ? "▶ 다음 판 시작" : "▶ 카운트 시작";
      $("resetBtn").disabled = state.phase === "running";
      $("lobbyBtn").disabled = state.phase === "lobby";
    };

    let resultWriting = false;
    function tick() {
      if (state.phase === "running") {
        const now = serverNow();
        const big = $("bigNum");
        if (now < state.startAt + READY) {
          const n = Math.ceil((state.startAt + READY - now) / 1000);
          $("bigLabel").textContent = "준비…";
          big.textContent = n > 0 ? String(n) : "";
          big.className = "";
        } else {
          const rem = endAt() - now;
          const hide = state.mode === "blind" || (state.mode === "hide3" && rem <= 3000);
          if (rem < -OVER) {
            $("bigLabel").textContent = "집계 중…";
            big.textContent = "TIME";
            big.className = "danger";
            if (!resultWriting && now > endAt() + OVER + 800) {
              resultWriting = true;
              fb.ref("zero/state").update({ phase: "result" }).finally(() => { resultWriting = false; });
            }
          } else if (hide) {
            $("bigLabel").textContent = "지금부터 숫자가 숨겨집니다!";
            big.textContent = "?.??";
            big.className = "secret";
          } else {
            $("bigLabel").textContent = "0.00에 STOP!";
            big.textContent = (rem / 1000).toFixed(2);
            big.className = rem <= 3000 ? "danger" : "";
          }
        }
        const done = Object.keys(players).filter((p) => presses[p]).length;
        $("pressCount").textContent = `STOP 누른 사람 ${done} / ${Object.keys(players).length}`;
        renderPlayers();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    $("startBtn").addEventListener("click", async () => {
      $("startBtn").disabled = true;
      await fb.ref("zero/state").set({
        round: state.round + 1,
        phase: "running",
        startAt: Math.round(serverNow()),
        mode: $("modeSel").value,
      }).catch(() => fatal("시작하지 못했습니다. 연결을 확인하세요."));
    });
    $("modeSel").addEventListener("change", (e) => {
      if (state.phase !== "running") fb.ref("zero/state").update({ mode: e.target.value });
    });
    $("lobbyBtn").addEventListener("click", () => fb.ref("zero/state").update({ phase: "lobby" }));
    let confirmT = 0;
    $("resetBtn").addEventListener("click", async () => {
      const b = $("resetBtn");
      if (!confirmT) {
        b.textContent = "한 번 더 누르면 초기화";
        confirmT = setTimeout(() => { confirmT = 0; b.textContent = "참가자 초기화"; }, 3000);
        return;
      }
      clearTimeout(confirmT); confirmT = 0; b.textContent = "참가자 초기화";
      await fb.ref("zero").update({ players: null, presses: null, clock: null,
        state: { round: 0, phase: "lobby", startAt: 0, mode: $("modeSel").value } });
    });
    return;
  }

  // =========================================================
  //                        참가자 화면
  // =========================================================
  $("player").hidden = false;
  $("nickInput").value = lsGet("zeroNick") || "";
  fb.ref(".info/connected").on("value", (s) => {
    $("pConn").textContent = s.val() ? "● 연결됨" : "연결 중…";
    if (s.val()) $("joinBtn").disabled = false;
  });
  syncClock(6);

  let pressing = false;
  const joined = () => !!players[myId];

  $("joinBtn").addEventListener("click", async () => {
    const nick = $("nickInput").value.trim().slice(0, 10);
    const msg = $("joinMsg");
    msg.hidden = true;
    const fail = (t) => { msg.hidden = false; msg.textContent = t; };
    if (!nick) return fail("닉네임을 입력해 주세요.");
    const others = Object.entries(players).filter(([pid]) => pid !== myId);
    if (others.length >= MAX_PLAYERS) return fail(`참가 인원(${MAX_PLAYERS}명)이 모두 찼습니다.`);
    if (others.some(([, p]) => p.nick === nick)) return fail("같은 닉네임이 있어요. 다른 닉네임을 써 주세요.");
    lsSet("zeroNick", nick);
    $("joinBtn").disabled = true;
    try {
      await fb.ref("zero/players/" + myId).set({ nick, joinedAt: firebase.database.ServerValue.TIMESTAMP });
      syncClock(4);
    } catch (e) { fail("참가하지 못했습니다. 연결을 확인해 주세요."); }
    $("joinBtn").disabled = false;
  });

  $("leaveBtn").addEventListener("click", () => fb.ref("zero/players/" + myId).remove());

  function canPress() {
    if (!joined() || state.phase !== "running" || presses[myId] || pressing) return false;
    const now = serverNow();
    return now >= state.startAt + READY && now <= endAt() + OVER;
  }

  async function press(e) {
    const t = localNow();               // 누른 순간을 가장 먼저 기록
    if (e) e.preventDefault();
    if (!canPress()) return;
    pressing = true;
    const at = t + offset;
    const diff = Math.round(at - endAt());   // 음수: 빨리, 양수: 늦게
    $("stopBtn").className = "pressed";
    $("stopBtn").textContent = "✔";
    try { if (navigator.vibrate) navigator.vibrate(40); } catch (er) {}
    try {
      await fb.ref(`zero/presses/${state.round}/${myId}`).set({ at: Math.round(at), diff });
    } catch (er) {
      $("pStatus").textContent = "기록 저장 실패! 진행자에게 알려 주세요.";
    }
    pressing = false;
    onChange();
  }
  $("stopBtn").addEventListener("pointerdown", press);
  $("stopBtn").addEventListener("contextmenu", (e) => e.preventDefault());

  onChange = () => {
    const me = players[myId];
    $("joinBox").hidden = !!me;
    $("playBox").hidden = !me;
    if (!me) return;
    $("pNick").textContent = `${me.nick} 님 · 프로젝터 화면을 보세요`;
    const mine = presses[myId];
    const res = $("myResult");
    res.textContent = "";
    if (state.phase === "result") {
      const list = ranking();
      const idx = list.filter((r) => r.diff !== null).findIndex((r) => r.pid === myId);
      $("pStatus").textContent = `${state.round}판 결과`;
      if (mine) {
        const l1 = document.createElement("div");
        const b = document.createElement("b"); b.textContent = fmtDiff(mine.diff);
        l1.append(b);
        const l2 = document.createElement("div");
        l2.textContent = `${idx + 1}위 · 멈춘 시점 ${stopAtText(mine.diff)}`;
        res.append(l1, l2);
      } else res.textContent = "이번 판은 STOP을 누르지 않았어요.";
    } else if (state.phase === "lobby") {
      $("pStatus").textContent = "대기 중 · 진행자가 곧 시작합니다";
    }
  };

  // 버튼 상태는 시계에 따라 바뀌므로 계속 확인
  function ptick() {
    const btn = $("stopBtn");
    if (joined() && !pressing) {
      const mine = presses[myId];
      if (state.phase === "running") {
        const now = serverNow();
        if (mine) {
          btn.className = "pressed"; btn.textContent = "✔"; btn.disabled = true;
          $("pStatus").textContent = "기록 완료! 결과는 프로젝터에서";
        } else if (now < state.startAt + READY) {
          btn.className = ""; btn.textContent = "준비"; btn.disabled = true;
          $("pStatus").textContent = "곧 시작합니다… 프로젝터를 보세요!";
        } else if (now <= endAt() + OVER) {
          btn.className = "live"; btn.textContent = "STOP"; btn.disabled = false;
          $("pStatus").textContent = "0.00에 맞춰 누르세요!";
        } else {
          btn.className = ""; btn.textContent = "종료"; btn.disabled = true;
          $("pStatus").textContent = "시간 초과";
        }
      } else {
        btn.className = ""; btn.disabled = true;
        btn.textContent = state.phase === "result" && mine ? "✔" : "STOP";
      }
    }
    requestAnimationFrame(ptick);
  }
  requestAnimationFrame(ptick);
})();
</script>
</body>
</html>
