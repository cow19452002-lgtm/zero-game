<!--
  ======================================================================
  0.00초 맞추기 — 현장 이벤트용 (최대 7명)

  [모드 1] 기기 한 대로 돌아가며 하기
    - 아래 FIREBASE_CONFIG를 비워 두면(null) 이 모드로 동작합니다.
    - 파일을 더블클릭해서 브라우저로 열기만 하면 됩니다.

  [모드 2] 각자 휴대폰으로 QR 찍고 참가 (실시간 순위)
    1) https://console.firebase.google.com 에서 프로젝트 생성
    2) 빌드 > Realtime Database > 데이터베이스 만들기 > "테스트 모드로 시작"
    3) 프로젝트 설정 > 내 앱 > 웹 앱(</>) 추가 > 표시되는 firebaseConfig를
       아래 FIREBASE_CONFIG 자리에 붙여넣기 (databaseURL 줄이 꼭 있어야 함)
    4) 이 파일을 GitHub Pages / Netlify 등에 올려서 https 주소를 받기
    5) 진행자: 주소 끝에 ?host 를 붙여 열기  → QR·순위표·진행 버튼
       참가자: QR을 찍어서 접속
    ※ 테스트 모드 DB는 주소를 아는 누구나 쓸 수 있으니 행사 후 삭제하세요.
  ======================================================================
-->

<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

    margin: 0; min-height: 100vh; padding: 16px;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;

  h1 { margin: 0; font-size: 24px; }

  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer; touch-action: manipulation; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .controls button { padding: 12px 18px; font-size: 16px; background: #475569; color: #fff; }
  .controls button.primary { background: #22c55e; color: #052e16; }

  .playGrid { display: grid; gap: 16px; max-width: 560px; margin: 0 auto; }

  @media (max-width: 800px) { .local .playGrid { grid-template-columns: 1fr; } }
  input[type=text] { font: inherit; font-size: 20px; padding: 12px; border-radius: 10px; border: 0; width: 100%; margin: 10px 0; }

  #joinBtn, #startBtn { background: #22c55e; color: #052e16; }

  #display.hidden { visibility: hidden; }
  .btnRow { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .meta { font-size: 15px; opacity: .8; }
  .link { background: none; color: #7dd3fc; font-weight: 400; text-decoration: underline; padding: 6px; font-size: 14px; }
  #localControls { display: none; }
  .local #localControls { display: flex; }
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>0.00초 맞추기</h1>
      <div id="conn"></div>
    </div>
  </header>

  <!-- 진행자 화면 (?host) -->
  <section id="hostView" hidden>
    <div class="hostGrid">
      <div class="card center">
        <div id="qr"></div>
        <p style="font-size:18px;font-weight:700;margin:12px 0 0">QR을 찍고 참가하세요</p>
        <div class="url" id="urlText"></div>
      </div>
      <div class="card">
        <div class="statusBig" id="hStatus"></div>
        <div class="board big">
          <h2>라운드 <span id="hRound">1</span> 순위 · 참가 <span id="hCount">0</span>/7명</h2>
          <ol id="hBoard"></ol>
        </div>
      </div>
    </div>
  </section>

  <!-- 진행 버튼 (진행자 화면 / 한 기기 모드 공통) -->
  <div class="controls card" id="ctrlBox" hidden>
    <button id="openBtn">접수 마감</button>
    <label>숫자 표시
      <select id="modeSel">
        <option value="hide3">남은 3초부터 숨김</option>
        <option value="blind">처음부터 숨김</option>
        <option value="visible">끝까지 보임</option>
      </select>
    </label>
    <label>기회
      <select id="triesSel">
        <option value="1">1번</option>
        <option value="2">2번</option>
        <option value="3">3번</option>
        <option value="5">5번</option>
      </select>
    </label>
    <button id="newRoundBtn" class="danger">새 라운드</button>
  </div>

  <!-- 참가 화면 -->
  <section id="playView" style="margin-top:16px">
    <div class="playGrid">
      <div>
        <div id="modeNote" class="notice" hidden></div>
        <div class="card center" id="joinBox">
          <div style="font-size:18px;font-weight:700" id="joinTitle">닉네임을 입력하세요</div>
          <input type="text" id="nickInput" maxlength="12" placeholder="예: 홍길동">
          <button id="joinBtn" class="bigBtn" disabled>참가하기</button>
          <div id="joinMsg" class="notice warn" hidden></div>
        </div>
        <div class="card center" id="gameBox" hidden>
          <div class="meta"><b id="meNick"></b> · 남은 기회 <b id="triesLeft"></b></div>
          <div class="meta" id="rule" style="margin-top:4px"></div>
          <div id="display">10.00</div>
          <div class="btnRow">
            <button id="startBtn" class="bigBtn">START</button>
            <button id="stopBtn" class="bigBtn" disabled>STOP</button>
          </div>
          <div id="result"></div>
          <div id="gameMsg" class="notice" hidden></div>
          <button id="nextBtn" class="link" hidden>다음 참가자로 바꾸기</button>
        </div>
      </div>
      <div class="card board" id="pBoardBox">
        <h2>실시간 순위 <span class="sub" id="pCount"></span></h2>
        <ol id="pBoard"></ol>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const MAX_PLAYERS = 7;
  const LIMIT = 10000;   // 10.00초 → 0.00이 목표
  const OVER = 2000;     // 0.00 이후 2초가 지나면 자동 정지
  const DEFAULT_STATE = { round: 1, open: true, mode: "hide3", maxTries: 3 };
  const $ = (id) => document.getElementById(id);

  if (typeof FIREBASE_CONFIG === "undefined") {
    const c = $("conn");
    c.style.cssText = "background:#7c2d12;color:#fff;padding:12px;border-radius:10px;font-size:16px;opacity:1;margin-top:8px";
    c.textContent = "⚠ Firebase 설정값을 붙여넣은 부분에 형식 오류가 있습니다. 파일 위쪽 FIREBASE_CONFIG 부분을 확인하세요. (import 줄, 'const firebaseConfig =' 줄이 들어가면 안 됩니다)";
    $("ctrlBox").hidden = true; $("playView").hidden = true;
    return;
  }
  const params = new URLSearchParams(location.search);
  const isHost = params.has("host");
  const online = !!(FIREBASE_CONFIG && window.firebase);

  let state = { ...DEFAULT_STATE };
  let roundScores = {};      // { playerId: entry } — 현재 라운드
  let myId = null;           // 온라인: 이 기기 id / 한 기기 모드: 현재 참가자 닉네임
  let fb = null, roundRef = null;
  let t0 = 0, raf = 0, running = false, saving = false;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- 저장소 ----------
  async function saveEntry(id, entry) {
    if (online) await fb.ref(`zero/scores/${state.round}/${id}`).set(entry);
    else { roundScores[id] = entry; renderAll(); }
  }
  async function writeState(patch) {
    const next = { ...state, ...patch };
    if (online) await fb.ref("zero/state").set(next);
    else {
      if (next.round !== state.round) roundScores = {};
      state = next;
      if (myId && !roundScores[myId]) myId = null;
      renderAll();
    }
  }

  function entries() {
    return Object.entries(roundScores)
      .map(([id, s]) => ({ id, ...s, tries: Array.isArray(s.tries) ? s.tries : [] }))
      .sort((a, b) => {
        const ab = typeof a.best === "number" ? a.best : Infinity;
        const bb = typeof b.best === "number" ? b.best : Infinity;
        if (ab !== bb) return ab - bb;
        return (a.bestAt || 0) - (b.bestAt || 0);
      });
  }
  function myEntry() {
    if (!myId || !roundScores[myId]) return null;
    const s = roundScores[myId];
    return { id: myId, ...s, tries: Array.isArray(s.tries) ? s.tries : [] };
  }

  // ---------- 렌더링 ----------
  function fmtDiff(d) {
    if (typeof d !== "number") return "-";
    if (d === 0) return "0 ms";
    return (d > 0 ? "+" : "−") + Math.abs(d) + " ms";
  }
  function modeText(m) {
    return m === "blind" ? "숫자가 처음부터 숨겨집니다"
      : m === "visible" ? "숫자가 끝까지 보입니다"
      : "남은 3초부터 숫자가 숨겨집니다";
  }

  function renderBoard(olId) {
    const ol = $(olId);
    ol.textContent = "";
    const list = entries();
    if (!list.length) {
      const d = document.createElement("div");
      d.className = "empty"; d.textContent = "아직 참가자가 없습니다.";
      ol.appendChild(d); return;
    }
    let rank = 0;
    list.forEach((s) => {
      const li = document.createElement("li");
      if (s.id === myId && !isHost) li.classList.add("me");
      const r = document.createElement("div");
      r.className = "rank";
      if (typeof s.best === "number") {
        rank++;
        r.textContent = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
      } else r.textContent = "·";
      const n = document.createElement("div");
      n.className = "nick";
      n.textContent = String(s.nick || "참가자").slice(0, 12);
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = `${s.tries.length}/${state.maxTries}회 시도`;
      n.appendChild(sub);
      const ms = document.createElement("div");
      ms.className = "ms";
      ms.textContent = typeof s.best === "number" ? fmtDiff(s.bestDiff) : "대기 중";
      li.append(r, n, ms);
      ol.appendChild(li);
    });
  }

  function renderAll() {
    const count = entries().length;
    $("hRound").textContent = state.round;
    $("hCount").textContent = count;
    $("hStatus").textContent = state.open
      ? `● 진행 중 · 기회 ${state.maxTries}번 · ${modeText(state.mode)}`
      : "■ 마감됨 · 더 이상 플레이할 수 없습니다";
    $("openBtn").textContent = state.open ? "접수 마감" : "다시 열기";
    $("openBtn").className = state.open ? "" : "primary";
    $("modeSel").value = state.mode;
    $("triesSel").value = String(state.maxTries);
    renderBoard("hBoard");
    renderBoard("pBoard");
    $("pCount").textContent = `라운드 ${state.round} · ${count}/${MAX_PLAYERS}명`;

    const me = myEntry();
    if (!running) {
      $("joinBox").hidden = !!me;
      $("gameBox").hidden = !me;
    }
    if (me) {
      $("meNick").textContent = me.nick;
      const left = Math.max(0, state.maxTries - me.tries.length);
      $("triesLeft").textContent = `${left}/${state.maxTries}`;
      $("rule").textContent = modeText(state.mode);
      if (!running) {
        let text = "";
        if (!state.open) text = "진행자가 접수를 마감했습니다.";
        else if (left === 0) text = `모든 기회를 사용했습니다. 최고 기록: ${fmtDiff(me.bestDiff)}`;
        $("gameMsg").hidden = !text;
        $("gameMsg").textContent = text;
        $("startBtn").disabled = saving || !state.open || left === 0;
        $("startBtn").textContent = me.tries.length ? "다시하기" : "START";
        $("nextBtn").hidden = online;
      }
    }
  }

  // ---------- 참가 ----------
  $("joinBtn").addEventListener("click", async () => {
    const nick = $("nickInput").value.trim().slice(0, 12);
    const msg = $("joinMsg");
    msg.hidden = true;
    const fail = (t) => { msg.hidden = false; msg.textContent = t; };
    if (!nick) return fail("닉네임을 입력해 주세요.");
    if (!state.open) return fail("지금은 접수가 마감된 상태입니다.");
    const list = entries();

    if (!online) {
      // 한 기기 모드: 같은 닉네임이면 이어서 하기
      if (!roundScores[nick]) {
        if (list.length >= MAX_PLAYERS) return fail(`참가 인원(${MAX_PLAYERS}명)이 모두 찼습니다.`);
        roundScores[nick] = { nick, tries: [], best: null, bestDiff: null, bestAt: null };
      }
      myId = nick;
      resetDisplay();
      renderAll();
      return;
    }

    lsSet("zeroNick", nick);
    if (list.length >= MAX_PLAYERS) return fail(`참가 인원(${MAX_PLAYERS}명)이 모두 찼습니다.`);
    if (list.some((s) => s.nick === nick)) return fail("이미 같은 닉네임이 있어요. 다른 닉네임을 써 주세요.");
    $("joinBtn").disabled = true;
    try {
      await saveEntry(myId, { nick, tries: [], best: null, bestDiff: null, bestAt: 0 });
      resetDisplay();
    } catch (e) {
      fail("저장하지 못했습니다. 인터넷 연결을 확인해 주세요.");
    } finally {
      $("joinBtn").disabled = false;
      renderAll();
    }
  });
  $("nickInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("joinBtn").click(); });

  $("nextBtn").addEventListener("click", () => {
    myId = null;
    $("nickInput").value = "";
    $("result").textContent = "";
    renderAll();
    $("nickInput").focus();
  });

  // ---------- 게임 ----------
  function resetDisplay() {
    $("display").classList.remove("hidden");
    $("display").textContent = "10.00";
    $("result").textContent = "";
  }

  function loop() {
    const elapsed = performance.now() - t0;
    const rem = LIMIT - elapsed;
    const hide = state.mode === "blind" || (state.mode === "hide3" && rem <= 3000);
    $("display").classList.toggle("hidden", hide);
    $("display").textContent = (rem / 1000).toFixed(2);
    if (elapsed >= LIMIT + OVER) { stop(); return; }
    raf = requestAnimationFrame(loop);
  }

  function start() {
    const me = myEntry();
    if (running || saving || !me || !state.open) return;
    if (me.tries.length >= state.maxTries) return;
    running = true;
    resetDisplay();
    $("gameMsg").hidden = true;
    $("nextBtn").hidden = true;
    $("startBtn").disabled = true;
    $("stopBtn").disabled = false;
    t0 = performance.now();
    raf = requestAnimationFrame(loop);
  }

  async function stop() {
    if (!running) return;
    const now = performance.now();       // 누른 순간을 가장 먼저 기록
    running = false;
    cancelAnimationFrame(raf);
    $("stopBtn").disabled = true;

    const elapsed = now - t0;
    const diff = Math.round(elapsed - LIMIT);   // 음수: 빨리, 양수: 늦게
    const abs = Math.abs(diff);
    $("display").classList.remove("hidden");
    $("display").textContent = ((LIMIT - elapsed) / 1000).toFixed(2);

    const grade = abs <= 10 ? "완벽! 🎯" : abs <= 50 ? "아주 좋아요 👍" : abs <= 150 ? "괜찮아요" : "아쉬워요";
    const side = diff === 0 ? "정확히 맞췄어요!" : diff < 0 ? `${abs} ms 빨랐어요` : `${abs} ms 늦었어요`;
    $("result").textContent = "";
    const l1 = document.createElement("div"); l1.textContent = grade;
    const l2 = document.createElement("div"); l2.textContent = side;
    $("result").append(l1, l2);

    const me = myEntry();
    if (!me) { renderAll(); return; }
    const tries = me.tries.concat([diff]);
    let { best, bestDiff, bestAt } = me;
    if (typeof best !== "number" || abs < best) { best = abs; bestDiff = diff; bestAt = Date.now(); }

    saving = true;
    try {
      await saveEntry(myId, { nick: me.nick, tries, best, bestDiff, bestAt });
    } catch (e) {
      $("gameMsg").hidden = false;
      $("gameMsg").textContent = "기록을 저장하지 못했습니다. 진행자에게 알려 주세요.";
    } finally {
      saving = false;
      renderAll();
    }
  }

  $("startBtn").addEventListener("click", start);
  $("stopBtn").addEventListener("pointerdown", (e) => { e.preventDefault(); stop(); });
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || isHost) return;
    if (document.activeElement === $("nickInput")) return;
    e.preventDefault();
    if (running) stop(); else start();
  });

  // ---------- 진행 버튼 ----------
  const safeWrite = (p) => writeState(p).catch(() => { $("conn").textContent = "설정을 저장하지 못했습니다."; });
  $("openBtn").addEventListener("click", () => safeWrite({ open: !state.open }));
  $("modeSel").addEventListener("change", (e) => safeWrite({ mode: e.target.value }));
  $("triesSel").addEventListener("change", (e) => safeWrite({ maxTries: Number(e.target.value) }));
  let confirmTimer = 0;
  $("newRoundBtn").addEventListener("click", () => {
    const b = $("newRoundBtn");
    if (!confirmTimer) {
      b.textContent = "한 번 더 누르면 새 라운드";
      confirmTimer = setTimeout(() => { confirmTimer = 0; b.textContent = "새 라운드"; }, 3000);
      return;
    }
    clearTimeout(confirmTimer); confirmTimer = 0; b.textContent = "새 라운드";
    if (!online) { myId = null; resetDisplay(); }
    safeWrite({ round: state.round + 1, open: true });
  });

  // ---------- 시작 ----------
  if (!online) {
    // 한 기기 모드
    document.body.classList.add("local");
    $("ctrlBox").hidden = false;
    $("modeNote").hidden = false;
    $("modeNote").textContent = FIREBASE_CONFIG && !window.firebase
      ? "실시간 서버에 연결하지 못해 '기기 한 대' 모드로 실행 중입니다. 참가자들이 이 화면에서 돌아가며 플레이하세요."
      : "기기 한 대 모드: 참가자들이 이 화면에서 돌아가며 플레이하세요. 기록은 이 화면에만 남습니다.";
    $("joinTitle").textContent = "참가자 닉네임 (최대 7명)";
    $("conn").textContent = "기기 한 대 모드";
    $("joinBtn").disabled = false;
    renderAll();
    return;
  }

  // 온라인 모드
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = firebase.database();
  myId = lsGet("zeroPid");
  if (!myId) { myId = "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet("zeroPid", myId); }
  $("nickInput").value = lsGet("zeroNick") || "";

  if (isHost) {
    $("hostView").hidden = false;
    $("ctrlBox").hidden = false;
    $("playView").hidden = true;
    const joinUrl = location.origin + location.pathname;
    $("urlText").textContent = joinUrl;
    try { new QRCode($("qr"), { text: joinUrl, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { $("qr").textContent = "QR을 불러오지 못했습니다"; }
  }

  $("conn").textContent = "연결 중…";
  fb.ref(".info/connected").on("value", (s) => {
    $("conn").textContent = s.val() ? "● 실시간 연결됨" : "연결 중… (인터넷 연결을 확인하세요)";
  });

  fb.ref("zero/state").on("value", (snap) => {
    const d = snap.val() || {};
    const prevRound = state.round;
    state = {
      round: Number(d.round) || 1,
      open: d.open !== false,
      mode: ["hide3", "blind", "visible"].includes(d.mode) ? d.mode : "hide3",
      maxTries: Number(d.maxTries) || 3,
    };
    if (!roundRef || prevRound !== state.round) {
      if (roundRef) roundRef.off();
      roundScores = {};
      roundRef = fb.ref(`zero/scores/${state.round}`);
      roundRef.on("value", (s) => { roundScores = s.val() || {}; renderAll(); });
    }
    $("joinBtn").disabled = false;
    renderAll();
  }, () => {
    $("conn").textContent = "데이터베이스에 접근할 수 없습니다. Firebase 규칙(테스트 모드)을 확인하세요.";
  });
})();
</script>
</body>
</html>
